<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Factory Pro Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #ff6b35;
            --secondary: #1a1a1a;
            --accent: #f7931e;
            --bg: #0a0a0a;
            --card-bg: #1a1a1a;
            --text: #e0e0e0;
            --text-muted: #888;
            --border: #333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Work Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255, 107, 53, 0.03) 2px, rgba(255, 107, 53, 0.03) 4px),
                repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(255, 107, 53, 0.03) 2px, rgba(255, 107, 53, 0.03) 4px);
            pointer-events: none;
            z-index: 0;
        }

        .login-container {
            background: var(--card-bg);
            border: 2px solid var(--border);
            padding: 3rem;
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 1;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.4s;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
        }

        .login-container:hover {
            border-color: var(--primary);
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.5rem;
            letter-spacing: 2px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text);
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 1rem;
            font-family: 'Work Sans', sans-serif;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 107, 53, 0.05);
        }

        .btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            padding: 0.8rem;
            border: none;
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            font-size: 1rem;
            font-family: 'Work Sans', sans-serif;
            margin-top: 1rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 107, 53, 0.4);
        }

        .alert {
            padding: 1rem;
            margin-bottom: 1rem;
            border: 1px solid transparent;
            font-size: 0.9rem;
            text-align: center;
        }

        .alert-error {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            border-color: #ff6b6b;
        }

    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>Create Account</h1>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Join Factory Pro Tools</p>
        </div>

        <div th:if="${param.error != null and param.error[0] == 'exists'}" class="alert alert-error">
            Username already exists! Please choose another.
        </div>

        <div th:if="${param.error != null and param.error[0] == 'invalid_admin'}" class="alert alert-error">
            Invalid Admin Password! You are not authorized to register.
        </div>

        <form th:action="@{/register}" method="post">
            <div class="form-group">
                <label for="username"><i class="fas fa-user me-2"></i>Choose Username</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password"><i class="fas fa-lock me-2"></i>Create Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label for="adminPassword"><i class="fas fa-key me-2"></i>Admin Password</label>
                <input type="password" id="adminPassword" name="adminPassword" required placeholder="Required for registration">
            </div>

            <button type="submit" class="btn">Register</button>
            
            <div style="text-align: center; margin-top: 1.5rem;">
                <a th:href="@{/login}" style="color: var(--primary); text-decoration: none; font-size: 0.9rem;">
                    Already have an account? Login here
                </a>
            </div>
        </form>
    </div>
</body>
</html>
