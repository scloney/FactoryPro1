<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Factory Pro Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary:   #ff6b35;
            --accent:    #f7931e;
            --bg:        #0a0a0a;
            --surface:   #141414;
            --card:      #1a1a1a;
            --card2:     #1f1f1f;
            --border:    #2a2a2a;
            --text:      #e0e0e0;
            --muted:     #888;
            --green:     #22c55e;
            --red:       #ef4444;
            --blue:      #3b82f6;
            --yellow:    #eab308;
            --radius:    6px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Work Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,107,53,.025) 2px, rgba(255,107,53,.025) 4px),
                repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(255,107,53,.025) 2px, rgba(255,107,53,.025) 4px);
            pointer-events: none;
            z-index: 0;
        }

        .login-container {
            background: var(--card-bg);
            border: 2px solid var(--border);
            padding: 3rem;
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 1;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.4s;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
        }

        .login-container:hover {
            border-color: var(--primary);
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.5rem;
            letter-spacing: 2px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text);
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 1rem;
            font-family: 'Work Sans', sans-serif;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 107, 53, 0.05);
        }

        .btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            padding: 0.8rem;
            border: none;
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            font-size: 1rem;
            font-family: 'Work Sans', sans-serif;
            margin-top: 1rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 107, 53, 0.4);
        }

        .alert {
            padding: 1rem;
            margin-bottom: 1rem;
            border: 1px solid transparent;
            font-size: 0.9rem;
            text-align: center;
        }

        .alert-error {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            border-color: #ff6b6b;
        }

    
        /* ── Top nav (dashboard-identical) ─────────────────────────────────── */
        .topbar {
            background: rgba(20,20,20,.96); border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px);
            position: sticky; top: 0; z-index: 200;
            padding: 0 2rem; height: 60px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .topbar-left { display: flex; align-items: center; gap: .75rem; }
        .logo-hex {
            width: 34px; height: 34px;
            background: linear-gradient(135deg,var(--primary),var(--accent));
            clip-path: polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
            animation: spin 20s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .site-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.5rem; letter-spacing: 2px;
            background: linear-gradient(90deg,var(--primary),var(--accent));
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .topbar-right { display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; }
        .nav-link {
            color: var(--muted); text-decoration: none;
            font-size: .82rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: .8px; transition: color .2s;
        }
        .nav-link:hover { color: var(--primary); }
        .logout-btn {
            background: none; border: 1px solid var(--border); color: var(--muted);
            cursor: pointer; font-family: inherit; font-size: .82rem;
            font-weight: 600; letter-spacing: .8px; text-transform: uppercase;
            padding: .35rem .9rem; border-radius: var(--radius); transition: all .2s;
        }
        .logout-btn:hover { border-color: var(--primary); color: var(--primary); }
        /* ── Unified button system (dashboard-consistent) ──────────────────── */
        .btn {
            display: inline-flex; align-items: center; gap: .4rem;
            padding: .45rem 1rem;
            border-radius: var(--radius);
            font-family: 'Work Sans', sans-serif;
            font-size: .8rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: .6px;
            cursor: pointer; text-decoration: none;
            border: 1px solid transparent;
            transition: all .2s;
            white-space: nowrap;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff; border-color: transparent;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(255,107,53,.35); }
        .btn-success {
            background: rgba(34,197,94,.12); color: var(--green);
            border-color: rgba(34,197,94,.3);
        }
        .btn-success:hover { background: rgba(34,197,94,.22); border-color: var(--green); }
        .btn-danger {
            background: rgba(239,68,68,.12); color: var(--red);
            border-color: rgba(239,68,68,.3);
        }
        .btn-danger:hover { background: rgba(239,68,68,.22); border-color: var(--red); }
        .btn-warning {
            background: rgba(234,179,8,.12); color: var(--yellow);
            border-color: rgba(234,179,8,.3);
        }
        .btn-warning:hover { background: rgba(234,179,8,.22); border-color: var(--yellow); }
        .btn-secondary {
            background: rgba(255,255,255,.05); color: var(--muted);
            border-color: var(--border);
        }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
        .btn-info {
            background: rgba(59,130,246,.12); color: var(--blue);
            border-color: rgba(59,130,246,.3);
        }
        .btn-info:hover { background: rgba(59,130,246,.22); border-color: var(--blue); }
        .btn-sm { padding: .28rem .65rem; font-size: .72rem; }
        .btn-lg { padding: .65rem 1.4rem; font-size: .9rem; }
        /* ── Cards (dashboard-consistent) ──────────────────────────────────── */
        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 1.25rem;
            transition: border-color .25s;
        }
        .card:hover { border-color: rgba(255,107,53,.3); }
        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1rem; padding-bottom: .75rem;
            border-bottom: 1px solid var(--border);
        }
        .card-title {
            font-size: .8rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1px; color: var(--muted);
        }
        /* ── Tables (dashboard-consistent) ─────────────────────────────────── */
        table { width: 100%; border-collapse: collapse; }
        thead th {
            background: var(--surface);
            padding: .65rem .9rem;
            font-size: .72rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: .8px; color: var(--muted);
            border-bottom: 1px solid var(--border); text-align: left;
        }
        tbody tr { border-bottom: 1px solid var(--border); transition: background .15s; }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: rgba(255,255,255,.025); }
        tbody td { padding: .65rem .9rem; font-size: .85rem; vertical-align: middle; }
        /* ── Badges ─────────────────────────────────────────────────────────── */
        .badge {
            display: inline-block; padding: .15rem .5rem; border-radius: 20px;
            font-size: .65rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: .5px;
        }
        .badge-red, .badge-danger   { background: rgba(239,68,68,.15);  color: var(--red); }
        .badge-green, .badge-success{ background: rgba(34,197,94,.15);  color: var(--green); }
        .badge-orange, .badge-warning{ background: rgba(255,107,53,.15); color: var(--primary); }
        .badge-blue, .badge-info    { background: rgba(59,130,246,.15);  color: var(--blue); }
        .badge-yellow               { background: rgba(234,179,8,.15);   color: var(--yellow); }
        .badge-muted                { background: rgba(136,136,136,.15); color: var(--muted); }
        /* ── Page wrapper ───────────────────────────────────────────────────── */
        .page { max-width: 1400px; margin: 0 auto; padding: 2rem; position: relative; z-index: 1; }</style>head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>Create Account</h1>
            <p style="color: var(--muted); font-size: 0.9rem;">Join Factory Pro Tools</p>
        </div>

        <div th:if="${param.error != null and param.error[0] == 'exists'}" class="alert alert-error">
            Username already exists! Please choose another.
        </div>

        <div th:if="${param.error != null and param.error[0] == 'invalid_admin'}" class="alert alert-error">
            Invalid Admin Password! You are not authorized to register.
        </div>

        <form th:action="@{/register}" method="post">
            <div class="form-group">
                <label for="username"><i class="fas fa-user me-2"></i>Choose Username</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password"><i class="fas fa-lock me-2"></i>Create Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label for="adminPassword"><i class="fas fa-key me-2"></i>Admin Password</label>
                <input type="password" id="adminPassword" name="adminPassword" required placeholder="Required for registration">
            </div>

            <div class="form-group">
                <label for="role"><i class="fas fa-user-tag me-2"></i>Choose Role</label>
                <select id="role" name="role" required style="width: 100%; padding: 0.8rem; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); color: var(--text); font-family: inherit; font-size: 1rem; outline: none; transition: border-color 0.3s;" onfocus="this.style.borderColor='var(--primary)'" onblur="this.style.borderColor='var(--border)'">
                    <option value="STAFF" style="background:#1a1a1a; color:#e0e0e0;">STAFF</option>
                    <option value="ADMIN" style="background:#1a1a1a; color:#e0e0e0;">ADMIN</option>
                </select>
            </div>

            <button type="submit" class="btn">Register</button>
            
            <div style="text-align: center; margin-top: 1.5rem;">
                <a th:href="@{/login}" style="color: var(--primary); text-decoration: none; font-size: 0.9rem;">
                    Already have an account? Login here
                </a>
            </div>
        </form>
    </div>
</body>
</html>
