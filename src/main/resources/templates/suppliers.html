<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supplier Management - Factory Pro Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary:   #ff6b35;
            --accent:    #f7931e;
            --bg:        #0a0a0a;
            --surface:   #141414;
            --card:      #1a1a1a;
            --card2:     #1f1f1f;
            --border:    #2a2a2a;
            --text:      #e0e0e0;
            --muted:     #888;
            --green:     #22c55e;
            --red:       #ef4444;
            --blue:      #3b82f6;
            --yellow:    #eab308;
            --radius:    6px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Work Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255, 107, 53, 0.025) 2px, rgba(255, 107, 53, 0.025) 4px),
                repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(255, 107, 53, 0.025) 2px, rgba(255, 107, 53, 0.025) 4px);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            background: var(--card-bg);
            border: 2px solid var(--border);
            padding: 30px;
            margin-bottom: 30px;
            border-radius: 10px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.5rem;
            letter-spacing: 2px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        

        

        

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 2px solid var(--border);
            padding: 25px;
            border-radius: 10px;
            transition: all 0.3s;
        }

        .stat-card:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
        }

        .stat-card h3 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .stat-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Actions Bar */
        .actions-bar {
            background: var(--card-bg);
            border: 2px solid var(--border);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .search-box {
            flex: 1;
            min-width: 300px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        

        

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }

        /* Table */
        .table-container {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: var(--bg);
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 12px;
            color: var(--primary);
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 15px;
            border-bottom: 1px solid var(--border);
        }

        tbody tr {
            transition: all 0.3s;
        }

        tbody tr:hover {
            background: var(--bg);
        }

        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-success {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .badge-danger {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            overflow-y: auto;
        }

        .modal-content {
            background: var(--card-bg);
            max-width: 900px;
            margin: 50px auto;
            border-radius: 15px;
            border: 2px solid var(--border);
        }

        .modal-header {
            background: var(--bg);
            padding: 25px 30px;
            border-bottom: 2px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2rem;
            letter-spacing: 2px;
            color: var(--primary);
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text);
            font-size: 28px;
            cursor: pointer;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: var(--danger);
            color: white;
        }

        .modal-body {
            padding: 30px;
            max-height: calc(100vh - 200px);
            overflow-y: auto;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--primary);
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 12px;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid var(--border);
        }

        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 2px solid;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border-color: var(--success);
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border-color: var(--danger);
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        @media (max-width: 768px) {
            .header-top {
                flex-direction: column;
                gap: 20px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .actions-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                min-width: 100%;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 10px;
            }
        }

        /* ── Top nav ────────────────────────────────────────────────────── */
        .topbar {
            background: rgba(20,20,20,.96);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px);
            position: sticky; top: 0; z-index: 200;
            padding: 0 2rem;
            height: 60px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .topbar-left { display: flex; align-items: center; gap: .75rem; }
        .logo-hex {
            width: 34px; height: 34px;
            background: linear-gradient(135deg,var(--primary),var(--accent));
            clip-path: polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
            animation: spin 20s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .site-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.5rem; letter-spacing: 2px;
            background: linear-gradient(90deg,var(--primary),var(--accent));
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .topbar-right { display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; }
        .nav-link {
            color: var(--muted); text-decoration: none;
            font-size: .82rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: .8px;
            transition: color .2s;
        }
        .nav-link:hover, .nav-link.active { color: var(--primary); }
        .logout-btn {
            background: none; border: 1px solid var(--border);
            color: var(--muted); cursor: pointer;
            font-family: inherit; font-size: .82rem;
            font-weight: 600; letter-spacing: .8px;
            text-transform: uppercase;
            padding: .35rem .9rem; border-radius: var(--radius);
            transition: all .2s;
        }
        .logout-btn:hover { border-color: var(--primary); color: var(--primary); }
    
        /* ── Unified button system (dashboard-consistent) ──────────────────── */
        .btn {
            display: inline-flex; align-items: center; gap: .4rem;
            padding: .45rem 1rem;
            border-radius: var(--radius);
            font-family: 'Work Sans', sans-serif;
            font-size: .8rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: .6px;
            cursor: pointer; text-decoration: none;
            border: 1px solid transparent;
            transition: all .2s;
            white-space: nowrap;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff; border-color: transparent;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(255,107,53,.35); }
        .btn-success {
            background: rgba(34,197,94,.12); color: var(--green);
            border-color: rgba(34,197,94,.3);
        }
        .btn-success:hover { background: rgba(34,197,94,.22); border-color: var(--green); }
        .btn-danger {
            background: rgba(239,68,68,.12); color: var(--red);
            border-color: rgba(239,68,68,.3);
        }
        .btn-danger:hover { background: rgba(239,68,68,.22); border-color: var(--red); }
        .btn-warning {
            background: rgba(234,179,8,.12); color: var(--yellow);
            border-color: rgba(234,179,8,.3);
        }
        .btn-warning:hover { background: rgba(234,179,8,.22); border-color: var(--yellow); }
        .btn-secondary {
            background: rgba(255,255,255,.05); color: var(--muted);
            border-color: var(--border);
        }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
        .btn-info {
            background: rgba(59,130,246,.12); color: var(--blue);
            border-color: rgba(59,130,246,.3);
        }
        .btn-info:hover { background: rgba(59,130,246,.22); border-color: var(--blue); }
        .btn-sm { padding: .28rem .65rem; font-size: .72rem; }
        .btn-lg { padding: .65rem 1.4rem; font-size: .9rem; }
        /* ── Cards (dashboard-consistent) ──────────────────────────────────── */
        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 1.25rem;
            transition: border-color .25s;
        }
        .card:hover { border-color: rgba(255,107,53,.3); }
        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1rem; padding-bottom: .75rem;
            border-bottom: 1px solid var(--border);
        }
        .card-title {
            font-size: .8rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1px; color: var(--muted);
        }
        /* ── Tables (dashboard-consistent) ─────────────────────────────────── */
        table { width: 100%; border-collapse: collapse; }
        thead th {
            background: var(--surface);
            padding: .65rem .9rem;
            font-size: .72rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: .8px; color: var(--muted);
            border-bottom: 1px solid var(--border); text-align: left;
        }
        tbody tr { border-bottom: 1px solid var(--border); transition: background .15s; }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: rgba(255,255,255,.025); }
        tbody td { padding: .65rem .9rem; font-size: .85rem; vertical-align: middle; }
        /* ── Badges ─────────────────────────────────────────────────────────── */
        .badge {
            display: inline-block; padding: .15rem .5rem; border-radius: 20px;
            font-size: .65rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: .5px;
        }
        .badge-red, .badge-danger   { background: rgba(239,68,68,.15);  color: var(--red); }
        .badge-green, .badge-success{ background: rgba(34,197,94,.15);  color: var(--green); }
        .badge-orange, .badge-warning{ background: rgba(255,107,53,.15); color: var(--primary); }
        .badge-blue, .badge-info    { background: rgba(59,130,246,.15);  color: var(--blue); }
        .badge-yellow               { background: rgba(234,179,8,.15);   color: var(--yellow); }
        .badge-muted                { background: rgba(136,136,136,.15); color: var(--muted); }
        /* ── Page wrapper ───────────────────────────────────────────────────── */
        .page { max-width: 1400px; margin: 0 auto; padding: 2rem; position: relative; z-index: 1; }</style></head>
         <header class="topbar">
        <div class="topbar-left">
            <div class="logo-hex"></div>
            <span class="site-name">Factory Pro</span>
        </div>
        <div class="topbar-right">
            <span style="color: var(--muted); font-size: 0.82rem; display: inline-flex; align-items: center; gap: 0.35rem; margin-right: 0.5rem;" sec:authorize="isAuthenticated()">
                👤 <span sec:authentication="name" style="color: var(--primary); font-weight: 600; text-transform: uppercase;"></span>
                <span sec:authorize="hasRole('ADMIN')" class="badge badge-red" style="margin: 0; padding: 0.15rem 0.45rem; background: var(--red); color: white;">ADMIN</span>
                <span sec:authorize="hasRole('STAFF')" class="badge badge-orange" style="margin: 0; padding: 0.15rem 0.45rem; background: var(--primary); color: white;">STAFF</span>
            </span>
            <a href="/"                 class="nav-link">Dashboard</a>
            <a href="/inventory"        class="nav-link">Inventory</a>
            <a href="/quotations-list"  class="nav-link">Quotations</a>
            <a href="/bills"            class="nav-link">Bills</a>
            <a href="/sales-orders"     class="nav-link">Orders</a>
            <a href="/purchase-orders"  class="nav-link">PO</a>
            <a href="/customers"        class="nav-link">Customers</a>
            <a href="/suppliers"        class="nav-link active">Suppliers</a>
            <a href="/optimizer"        class="nav-link">Optimizer</a>
            <a href="/barcode/print"    class="nav-link">Barcodes</a>
            <form th:action="@{/logout}" method="post" style="display:inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="logout-btn" id="logout-btn">⏻ Logout</button>
            </form>
        </div>
    </header>
    <div class="container">

        <!-- Alert Container -->
        <div id="alertContainer"></div>

        <!-- Statistics -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3 id="totalSuppliers">0</h3>
                <p>Total Suppliers</p>
            </div>
            <div class="stat-card">
                <h3 id="activeSuppliers">0</h3>
                <p>Active Suppliers</p>
            </div>
            <div class="stat-card">
                <h3 id="totalOutstanding">₹0</h3>
                <p>Total Outstanding</p>
            </div>
            <div class="stat-card">
                <h3 id="exceedingCredit">0</h3>
                <p>Exceeding Credit Limit</p>
            </div>
        </div>

        <!-- Actions Bar -->
        <div class="actions-bar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Search suppliers by name, code, or company...">
            </div>
            <button class="btn btn-primary" onclick="openAddModal()">
                ➕ Add New Supplier
            </button>
        </div>

        <!-- Suppliers Table -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Code</th>
                        <th>Name</th>
                        <th>Company</th>
                        <th>Phone</th>
                        <th>GSTIN</th>
                        <th>Credit Limit</th>
                        <th>Outstanding</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="suppliersTableBody">
                    <!-- Data loaded via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add/Edit Supplier Modal -->
    <div id="supplierModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Supplier</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="supplierForm">
                    <input type="hidden" id="supplierId">
                    
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="supplierCode">Supplier Code *</label>
                            <input type="text" id="supplierCode" required>
                        </div>
                        <div class="form-group">
                            <label for="name">Name *</label>
                            <input type="text" id="name" required>
                        </div>
                        <div class="form-group">
                            <label for="companyName">Company Name</label>
                            <input type="text" id="companyName">
                        </div>
                        <div class="form-group">
                            <label for="contactPerson">Contact Person</label>
                            <input type="text" id="contactPerson">
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone</label>
                            <input type="tel" id="phone">
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email">
                        </div>
                        <div class="form-group">
                            <label for="gstin">GSTIN</label>
                            <input type="text" id="gstin">
                        </div>
                        <div class="form-group">
                            <label for="city">City</label>
                            <input type="text" id="city">
                        </div>
                        <div class="form-group">
                            <label for="state">State</label>
                            <input type="text" id="state">
                        </div>
                        <div class="form-group">
                            <label for="pincode">Pincode</label>
                            <input type="text" id="pincode">
                        </div>
                        <div class="form-group">
                            <label for="paymentTerms">Payment Terms</label>
                            <input type="text" id="paymentTerms" placeholder="e.g., Net 30">
                        </div>
                        <div class="form-group">
                            <label for="creditDays">Credit Days</label>
                            <input type="number" id="creditDays" value="0">
                        </div>
                        <div class="form-group">
                            <label for="creditLimit">Credit Limit</label>
                            <input type="number" id="creditLimit" step="0.01" value="0">
                        </div>
                        <div class="form-group">
                            <label for="active">Status</label>
                            <select id="active">
                                <option value="true">Active</option>
                                <option value="false">Inactive</option>
                            </select>
                        </div>
                        <div class="form-group full-width">
                            <label for="address">Address</label>
                            <textarea id="address" rows="2"></textarea>
                        </div>
                        <div class="form-group full-width">
                            <label for="notes">Notes</label>
                            <textarea id="notes" rows="3"></textarea>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn" onclick="closeModal()" style="background: var(--border);">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Supplier</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let suppliers = [];

        document.addEventListener('DOMContentLoaded', function() {
            loadSuppliers();
            loadStats();
            
            document.getElementById('searchInput').addEventListener('input', function(e) {
                filterSuppliers(e.target.value);
            });
            
            document.getElementById('supplierForm').addEventListener('submit', function(e) {
                e.preventDefault();
                saveSupplier();
            });
        });

        function loadSuppliers() {
            fetch('/suppliers/api')
                .then(response => response.json())
                .then(data => {
                    suppliers = data;
                    displaySuppliers(suppliers);
                })
                .catch(error => {
                    console.error('Error loading suppliers:', error);
                    showAlert('Failed to load suppliers', 'error');
                });
        }

        function loadStats() {
            fetch('/suppliers/api/stats')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('totalSuppliers').textContent = data.totalSuppliers || 0;
                    document.getElementById('activeSuppliers').textContent = data.activeSuppliers || 0;
                    document.getElementById('totalOutstanding').textContent = '₹' + (data.totalOutstanding || 0).toFixed(2);
                    document.getElementById('exceedingCredit').textContent = data.exceedingCreditLimit || 0;
                })
                .catch(error => console.error('Error loading stats:', error));
        }

        function displaySuppliers(data) {
            const tbody = document.getElementById('suppliersTableBody');
            
            if (data.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="9" class="empty-state">
                            <div>
                                <p style="font-size: 1.2em; margin-bottom: 10px;">No suppliers found</p>
                                <p>Click "Add New Supplier" to create your first supplier</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = data.map(supplier => `
                <tr>
                    <td><strong style="color: var(--primary);">${supplier.supplierCode}</strong></td>
                    <td>${supplier.name}</td>
                    <td>${supplier.companyName || '-'}</td>
                    <td>${supplier.phone || '-'}</td>
                    <td>${supplier.gstin || '-'}</td>
                    <td>₹${supplier.creditLimit.toFixed(2)}</td>
                    <td>
                        <span class="${supplier.outstandingBalance > supplier.creditLimit ? 'badge badge-danger' : 'badge badge-success'}">
                            ₹${supplier.outstandingBalance.toFixed(2)}
                        </span>
                    </td>
                    <td>
                        <span class="badge ${supplier.active ? 'badge-success' : 'badge-danger'}">
                            ${supplier.active ? 'Active' : 'Inactive'}
                        </span>
                    </td>
                    <td>
                        <button class="btn btn-warning btn-small" onclick="editSupplier(${supplier.id})">Edit</button>
                        <button class="btn btn-danger btn-small" onclick="deleteSupplier(${supplier.id})">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        function filterSuppliers(searchTerm) {
            const filtered = suppliers.filter(s => 
                s.supplierCode.toLowerCase().includes(searchTerm.toLowerCase()) ||
                s.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                (s.companyName && s.companyName.toLowerCase().includes(searchTerm.toLowerCase()))
            );
            displaySuppliers(filtered);
        }

        function openAddModal() {
            document.getElementById('modalTitle').textContent = 'Add New Supplier';
            document.getElementById('supplierForm').reset();
            document.getElementById('supplierId').value = '';
            document.getElementById('supplierModal').style.display = 'block';
        }

        function editSupplier(id) {
            fetch(`/suppliers/api/${id}`)
                .then(response => response.json())
                .then(supplier => {
                    document.getElementById('modalTitle').textContent = 'Edit Supplier';
                    document.getElementById('supplierId').value = supplier.id;
                    document.getElementById('supplierCode').value = supplier.supplierCode;
                    document.getElementById('name').value = supplier.name;
                    document.getElementById('companyName').value = supplier.companyName || '';
                    document.getElementById('contactPerson').value = supplier.contactPerson || '';
                    document.getElementById('phone').value = supplier.phone || '';
                    document.getElementById('email').value = supplier.email || '';
                    document.getElementById('gstin').value = supplier.gstin || '';
                    document.getElementById('address').value = supplier.address || '';
                    document.getElementById('city').value = supplier.city || '';
                    document.getElementById('state').value = supplier.state || '';
                    document.getElementById('pincode').value = supplier.pincode || '';
                    document.getElementById('paymentTerms').value = supplier.paymentTerms || '';
                    document.getElementById('creditDays').value = supplier.creditDays;
                    document.getElementById('creditLimit').value = supplier.creditLimit;
                    document.getElementById('active').value = supplier.active;
                    document.getElementById('notes').value = supplier.notes || '';
                    
                    document.getElementById('supplierModal').style.display = 'block';
                })
                .catch(error => {
                    console.error('Error loading supplier:', error);
                    showAlert('Failed to load supplier details', 'error');
                });
        }

        function saveSupplier() {
            const id = document.getElementById('supplierId').value;
            const supplier = {
                supplierCode: document.getElementById('supplierCode').value,
                name: document.getElementById('name').value,
                companyName: document.getElementById('companyName').value,
                contactPerson: document.getElementById('contactPerson').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                gstin: document.getElementById('gstin').value,
                address: document.getElementById('address').value,
                city: document.getElementById('city').value,
                state: document.getElementById('state').value,
                pincode: document.getElementById('pincode').value,
                paymentTerms: document.getElementById('paymentTerms').value,
                creditDays: parseInt(document.getElementById('creditDays').value) || 0,
                creditLimit: parseFloat(document.getElementById('creditLimit').value) || 0,
                active: document.getElementById('active').value === 'true',
                notes: document.getElementById('notes').value
            };

            const url = id ? `/suppliers/api/${id}` : '/suppliers/api';
            const method = id ? 'PUT' : 'POST';

            fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(supplier)
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(err => Promise.reject(err));
                }
                return response.json();
            })
            .then(() => {
                showAlert(`Supplier ${id ? 'updated' : 'created'} successfully!`, 'success');
                closeModal();
                loadSuppliers();
                loadStats();
            })
            .catch(error => {
                console.error('Error saving supplier:', error);
                showAlert(error.error || 'Failed to save supplier', 'error');
            });
        }

        function deleteSupplier(id) {
            if (!confirm('Are you sure you want to delete this supplier?')) {
                return;
            }

            fetch(`/suppliers/api/${id}`, { method: 'DELETE' })
            .then(response => {
                if (!response.ok) throw new Error('Failed to delete');
                showAlert('Supplier deleted successfully!', 'success');
                loadSuppliers();
                loadStats();
            })
            .catch(error => {
                console.error('Error deleting supplier:', error);
                showAlert('Failed to delete supplier', 'error');
            });
        }

        function closeModal() {
            document.getElementById('supplierModal').style.display = 'none';
        }

        function showAlert(message, type) {
            const alertContainer = document.getElementById('alertContainer');
            const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
            
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert ${alertClass}`;
            alertDiv.textContent = message;
            
            alertContainer.innerHTML = '';
            alertContainer.appendChild(alertDiv);
            
            setTimeout(() => alertDiv.remove(), 5000);
        }

        window.onclick = function(event) {
            const modal = document.getElementById('supplierModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
