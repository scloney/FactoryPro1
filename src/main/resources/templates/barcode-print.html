<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Product Barcodes | Factory Pro Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary:   #ff6b35;
            --accent:    #f7931e;
            --bg:        #0a0a0a;
            --surface:   #141414;
            --card:      #1a1a1a;
            --card2:     #1f1f1f;
            --border:    #2a2a2a;
            --text:      #e0e0e0;
            --muted:     #888;
            --green:     #22c55e;
            --red:       #ef4444;
            --blue:      #3b82f6;
            --yellow:    #eab308;
            --radius:    6px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Work Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255, 107, 53, 0.025) 2px, rgba(255, 107, 53, 0.025) 4px),
                repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(255, 107, 53, 0.025) 2px, rgba(255, 107, 53, 0.025) 4px);
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        .card {
            background: var(--card-bg);
            border: 2px solid var(--border);
            padding: 2rem;
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
            transition: all 0.4s;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 107, 53, 0.1), transparent);
            transition: left 0.5s;
        }

        .card:hover::before {
            left: 100%;
        }

        .card:hover {
            border-color: var(--primary);
        }

        .card h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 2px;
            margin-bottom: 1.5rem;
            color: var(--primary);
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .search-box {
            flex-grow: 1;
            max-width: 400px;
        }

        .search-box input {
            width: 100%;
            padding: 0.8rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 1rem;
            transition: all 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 107, 53, 0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1.5rem;
        }

        table th,
        table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        table th {
            background: rgba(255, 107, 53, 0.1);
            font-weight: 600;
            color: var(--primary);
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        table td {
            color: var(--text);
            vertical-align: middle;
        }

        table tbody tr {
            transition: all 0.3s;
        }

        table tbody tr:hover {
            background: rgba(255, 107, 53, 0.05);
        }

        .btn {
            display: inline-block;
            padding: 0.6rem 1.2rem;
            border: none;
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            font-size: 0.8rem;
            font-family: 'Work Sans', sans-serif;
            text-decoration: none;
        }

        

        

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-warning {
            background: var(--warning);
            color: #000;
        }

        

        .btn-success {
            background: var(--success);
            color: white;
        }

        

        .barcode-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.25rem;
        }

        .barcode-img {
            background: white;
            padding: 5px;
            border-radius: 4px;
        }

        .barcode-val {
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .alert-success {
            background: rgba(40, 167, 69, 0.2);
            border: 1px solid var(--success);
            color: #2ced5e;
            padding: 1rem;
            margin-bottom: 1.5rem;
            display: none;
        }

        /* PRINT CSS styles */
        @media print {
            body {
                background: white;
                color: black;
            }
            body::before {
                display: none;
            }
            header,
            .controls-row,
            .btn,
            th:last-child,
            td:last-child {
                display: none !important;
            }
            .container {
                width: 100%;
                max-width: 100%;
                padding: 0;
            }
            .card {
                border: none;
                padding: 0;
                background: white;
            }
            .card h2 {
                color: black;
                font-size: 1.5rem;
                margin-bottom: 1rem;
            }
            table {
                width: 100%;
                border-collapse: collapse;
            }
            table th {
                background: #eee !important;
                color: black !important;
                border-bottom: 2px solid #333;
            }
            table td {
                color: black;
                border-bottom: 1px solid #ddd;
            }
            .barcode-img {
                border: 1px solid #ccc;
            }
            .barcode-val {
                color: black;
            }
        }

        /* ── Top nav ────────────────────────────────────────────────────── */
        .topbar {
            background: rgba(20,20,20,.96);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px);
            position: sticky; top: 0; z-index: 200;
            padding: 0 2rem;
            height: 60px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .topbar-left { display: flex; align-items: center; gap: .75rem; }
        .logo-hex {
            width: 34px; height: 34px;
            background: linear-gradient(135deg,var(--primary),var(--accent));
            clip-path: polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
            animation: spin 20s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .site-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.5rem; letter-spacing: 2px;
            background: linear-gradient(90deg,var(--primary),var(--accent));
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .topbar-right { display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; }
        .nav-link {
            color: var(--muted); text-decoration: none;
            font-size: .82rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: .8px;
            transition: color .2s;
        }
        .nav-link:hover, .nav-link.active { color: var(--primary); }
        .logout-btn {
            background: none; border: 1px solid var(--border);
            color: var(--muted); cursor: pointer;
            font-family: inherit; font-size: .82rem;
            font-weight: 600; letter-spacing: .8px;
            text-transform: uppercase;
            padding: .35rem .9rem; border-radius: var(--radius);
            transition: all .2s;
        }
        .logout-btn:hover { border-color: var(--primary); color: var(--primary); }

        .badge {
            display: inline-block;
            padding: .15rem .45rem; border-radius: 20px;
            font-size: .65rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: .5px;
            margin-left: .4rem; vertical-align: middle;
        }
        .badge-red    { background: rgba(239,68,68,.15);  color: var(--red); }
        .badge-green  { background: rgba(34,197,94,.15);  color: var(--green); }
        .badge-orange { background: rgba(255,107,53,.15); color: var(--primary); }
    
        /* ── Unified button system (dashboard-consistent) ──────────────────── */
        .btn {
            display: inline-flex; align-items: center; gap: .4rem;
            padding: .45rem 1rem;
            border-radius: var(--radius);
            font-family: 'Work Sans', sans-serif;
            font-size: .8rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: .6px;
            cursor: pointer; text-decoration: none;
            border: 1px solid transparent;
            transition: all .2s;
            white-space: nowrap;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff; border-color: transparent;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(255,107,53,.35); }
        .btn-success {
            background: rgba(34,197,94,.12); color: var(--green);
            border-color: rgba(34,197,94,.3);
        }
        .btn-success:hover { background: rgba(34,197,94,.22); border-color: var(--green); }
        .btn-danger {
            background: rgba(239,68,68,.12); color: var(--red);
            border-color: rgba(239,68,68,.3);
        }
        .btn-danger:hover { background: rgba(239,68,68,.22); border-color: var(--red); }
        .btn-warning {
            background: rgba(234,179,8,.12); color: var(--yellow);
            border-color: rgba(234,179,8,.3);
        }
        .btn-warning:hover { background: rgba(234,179,8,.22); border-color: var(--yellow); }
        .btn-secondary {
            background: rgba(255,255,255,.05); color: var(--muted);
            border-color: var(--border);
        }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
        .btn-info {
            background: rgba(59,130,246,.12); color: var(--blue);
            border-color: rgba(59,130,246,.3);
        }
        .btn-info:hover { background: rgba(59,130,246,.22); border-color: var(--blue); }
        .btn-sm { padding: .28rem .65rem; font-size: .72rem; }
        .btn-lg { padding: .65rem 1.4rem; font-size: .9rem; }
        /* ── Cards (dashboard-consistent) ──────────────────────────────────── */
        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 1.25rem;
            transition: border-color .25s;
        }
        .card:hover { border-color: rgba(255,107,53,.3); }
        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1rem; padding-bottom: .75rem;
            border-bottom: 1px solid var(--border);
        }
        .card-title {
            font-size: .8rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1px; color: var(--muted);
        }
        /* ── Tables (dashboard-consistent) ─────────────────────────────────── */
        table { width: 100%; border-collapse: collapse; }
        thead th {
            background: var(--surface);
            padding: .65rem .9rem;
            font-size: .72rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: .8px; color: var(--muted);
            border-bottom: 1px solid var(--border); text-align: left;
        }
        tbody tr { border-bottom: 1px solid var(--border); transition: background .15s; }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: rgba(255,255,255,.025); }
        tbody td { padding: .65rem .9rem; font-size: .85rem; vertical-align: middle; }
        /* ── Badges ─────────────────────────────────────────────────────────── */
        .badge {
            display: inline-block; padding: .15rem .5rem; border-radius: 20px;
            font-size: .65rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: .5px;
        }
        .badge-red, .badge-danger   { background: rgba(239,68,68,.15);  color: var(--red); }
        .badge-green, .badge-success{ background: rgba(34,197,94,.15);  color: var(--green); }
        .badge-orange, .badge-warning{ background: rgba(255,107,53,.15); color: var(--primary); }
        .badge-blue, .badge-info    { background: rgba(59,130,246,.15);  color: var(--blue); }
        .badge-yellow               { background: rgba(234,179,8,.15);   color: var(--yellow); }
        .badge-muted                { background: rgba(136,136,136,.15); color: var(--muted); }
        /* ── Page wrapper ───────────────────────────────────────────────────── */
        .page { max-width: 1400px; margin: 0 auto; padding: 2rem; position: relative; z-index: 1; }</style>
<body>
    <header class="topbar">
        <div class="topbar-left">
            <div class="logo-hex"></div>
            <span class="site-name">Factory Pro</span>
        </div>
        <div class="topbar-right">
            <span style="color: var(--muted); font-size: 0.82rem; display: inline-flex; align-items: center; gap: 0.35rem; margin-right: 0.5rem;" sec:authorize="isAuthenticated()">
                👤 <span sec:authentication="name" style="color: var(--primary); font-weight: 600; text-transform: uppercase;"></span>
                <span sec:authorize="hasRole('ADMIN')" class="badge badge-red" style="margin: 0; padding: 0.15rem 0.45rem; background: var(--red); color: white;">ADMIN</span>
                <span sec:authorize="hasRole('STAFF')" class="badge badge-orange" style="margin: 0; padding: 0.15rem 0.45rem; background: var(--primary); color: white;">STAFF</span>
            </span>
            <a href="/"                 class="nav-link">Dashboard</a>
            <a href="/inventory"        class="nav-link">Inventory</a>
            <a href="/quotations-list"  class="nav-link">Quotations</a>
            <a href="/bills"            class="nav-link">Bills</a>
            <a href="/sales-orders"     class="nav-link">Orders</a>
            <a href="/purchase-orders"  class="nav-link">PO</a>
            <a href="/customers"        class="nav-link">Customers</a>
            <a href="/suppliers"        class="nav-link">Suppliers</a>
            <a href="/optimizer"        class="nav-link">Optimizer</a>
            <a href="/barcode/print"    class="nav-link active">Barcodes</a>
            <form th:action="@{/logout}" method="post" style="display:inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="logout-btn" id="logout-btn">⏻ Logout</button>
            </form>
        </div>
    </header>

    <div class="container">
        <div id="alertSuccess" class="alert-success"></div>

        <div class="card">
            <h2>Product Catalog & Barcodes</h2>

            <div class="controls-row">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search products by name or code..." onkeyup="filterProducts()">
                </div>
                <div style="display: flex; gap: 1rem;">
                    <button class="btn btn-success" onclick="generateAllBarcodes()">
                        <i class="fas fa-barcode"></i> Generate All Barcodes
                    </button>
                    <button class="btn btn-primary" onclick="window.print()">
                        <i class="fas fa-print"></i> Print Page
                    </button>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Code</th>
                        <th>Product Name</th>
                        <th>Unit</th>
                        <th>Stock Level</th>
                        <th>Barcode Visual</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="productsTableBody">
                    <tr th:each="product : ${products}" th:id="'product-row-' + ${product.id}">
                        <td th:text="${product.productCode}">PROD-001</td>
                        <td class="product-name" th:text="${product.name}">Premium Teak Plywood</td>
                        <td th:text="${product.unit}">Sheets</td>
                        <td>
                            <span th:text="${product.currentStock}">45</span>
                        </td>
                        <td>
                            <div th:id="'barcode-container-' + ${product.id}" class="barcode-container" th:style="${product.barcodeValue == null || product.barcodeValue.isEmpty() ? 'display: none;' : ''}">
                                <img th:id="'barcode-img-' + ${product.id}" th:src="${product.barcodeValue != null ? '/api/barcode/image/' + product.id : ''}" width="150" height="50" class="barcode-img" alt="Barcode">
                                <span th:id="'barcode-val-' + ${product.id}" class="barcode-val" th:text="${product.barcodeValue}">PLY-1-12345</span>
                            </div>
                            <span th:id="'barcode-placeholder-' + ${product.id}" th:style="${product.barcodeValue != null && !product.barcodeValue.isEmpty() ? 'display: none;' : ''}" style="color: var(--muted); font-style: italic;">
                                No barcode generated
                            </span>
                        </td>
                        <td>
                            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                                <button class="btn btn-warning btn-sm" th:onclick="'generateProductBarcode(' + ${product.id} + ')'" title="Generate Barcode">
                                    <i class="fas fa-magic"></i> Generate
                                </button>
                                <a th:id="'print-barcode-btn-' + ${product.id}" th:href="${product.barcodeValue != null ? '/api/barcode/image/' + product.id : '#'}" target="_blank" class="btn btn-primary btn-sm" th:style="${product.barcodeValue == null || product.barcodeValue.isEmpty() ? 'display: none;' : ''}" title="Open Barcode in New Tab">
                                    <i class="fas fa-barcode"></i> Print Barcode
                                </a>
                                <a th:id="'print-qr-btn-' + ${product.id}" th:href="${product.barcodeValue != null ? '/api/barcode/qr/' + product.id : '#'}" target="_blank" class="btn btn-secondary btn-sm" th:style="${product.barcodeValue == null || product.barcodeValue.isEmpty() ? 'display: none;' : ''}" title="Open QR Code in New Tab">
                                    <i class="fas fa-qrcode"></i> Print QR
                                </a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script th:inline="javascript">
        // Live search filter
        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.querySelectorAll('#productsTableBody tr');
            
            rows.forEach(row => {
                const name = row.querySelector('.product-name').textContent.toLowerCase();
                const code = row.cells[0].textContent.toLowerCase();
                if (name.includes(query) || code.includes(query)) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        }

        // Generate barcode for a single product
        function generateProductBarcode(productId) {
            const alertBox = document.getElementById('alertSuccess');
            fetch(`/api/barcode/generate/${productId}`, {
                method: 'POST'
            })
            .then(response => {
                if (response.ok) {
                    const barcodeVal = response.headers.get('X-Barcode-Value');
                    
                    // Update visual image and value label
                    const img = document.getElementById(`barcode-img-${productId}`);
                    const val = document.getElementById(`barcode-val-${productId}`);
                    const container = document.getElementById(`barcode-container-${productId}`);
                    const placeholder = document.getElementById(`barcode-placeholder-${productId}`);
                    
                    const printBarBtn = document.getElementById(`print-barcode-btn-${productId}`);
                    const printQrBtn = document.getElementById(`print-qr-btn-${productId}`);

                    // Refresh image with a random cache-buster query param
                    img.src = `/api/barcode/image/${productId}?t=${new Date().getTime()}`;
                    val.textContent = barcodeVal;
                    
                    container.style.display = 'flex';
                    placeholder.style.display = 'none';
                    
                    printBarBtn.href = `/api/barcode/image/${productId}`;
                    printBarBtn.style.display = 'inline-block';
                    
                    printQrBtn.href = `/api/barcode/qr/${productId}`;
                    printQrBtn.style.display = 'inline-block';

                    showAlert(`Successfully generated barcode: ${barcodeVal}`);
                } else {
                    alert('Error generating barcode. Please try again.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Connection error while generating barcode.');
            });
        }

        // Bulk generate barcodes
        function generateAllBarcodes() {
            if (!confirm('Are you sure you want to generate barcodes for all products currently lacking one?')) {
                return;
            }

            fetch('/api/barcode/generate-all', {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                showAlert(data.message || 'Successfully bulk generated barcodes.');
                // Reload page after a delay to show all new barcodes
                setTimeout(() => {
                    window.location.reload();
                }, 1500);
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Connection error during bulk generation.');
            });
        }

        function showAlert(msg) {
            const alertBox = document.getElementById('alertSuccess');
            alertBox.textContent = msg;
            alertBox.style.display = 'block';
            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 4000);
        }
    </script>
</body>
</html>
